name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test ./...
      - run: go vet ./...
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Test on Windows
        run: go test ./...
      - name: Run the published Windows installer
        shell: pwsh
        run: |
          $installer = Get-Content -Raw ./scripts/install.ps1
          $expectedVersion = [regex]::Match($installer, '/releases/download/v(?<version>\d+\.\d+\.\d+)/').Groups['version'].Value
          if (-not $expectedVersion) { throw 'Installer must pin a published release version.' }
          & ./scripts/install.ps1
          $actual = & "$env:LOCALAPPDATA/Atlas/atlas.exe" version
          if ($LASTEXITCODE -ne 0 -or $actual -ne "atlas $expectedVersion") {
            throw "Published Windows CLI did not report the expected version: $actual"
          }
  platforms:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build ./cmd/atlas
